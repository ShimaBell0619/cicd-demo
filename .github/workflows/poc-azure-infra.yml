name: Temporary Azure Bicep PoC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-azure-infra.yml'

permissions:
  contents: read
  id-token: write

env:
  LOCATION: japaneast

jobs:
  deploy-verify-destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESOURCE_GROUP: rg-cicd-demo-poc-gha-${{ github.run_id }}
      NAME_PREFIX: cicd-poc-${{ github.run_id }}
      DEPLOYMENT_NAME: cicd-demo-poc-${{ github.run_id }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Read proven Azure OIDC bootstrap identifiers
        id: azure-oidc
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error             https://raw.githubusercontent.com/ShimaBell0619/switchbot-home-dashboard/main/.github/workflows/deploy-azure.yml             --output /tmp/azure-bootstrap.yml

          read_value() {
            local name="$1"
            awk -v key="$name:" '$1 == key {print $2; exit}' /tmp/azure-bootstrap.yml
          }

          client_id="$(read_value AZURE_CLIENT_ID)"
          tenant_id="$(read_value AZURE_TENANT_ID)"
          subscription_id="$(read_value AZURE_SUBSCRIPTION_ID)"

          [[ -n "$client_id" && -n "$tenant_id" && -n "$subscription_id" ]]

          echo "::add-mask::$client_id"
          echo "::add-mask::$tenant_id"
          echo "::add-mask::$subscription_id"

          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$tenant_id" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$subscription_id" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ steps.azure-oidc.outputs.client_id }}
          tenant-id: ${{ steps.azure-oidc.outputs.tenant_id }}
          subscription-id: ${{ steps.azure-oidc.outputs.subscription_id }}

      - name: Validate Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Preview deployment
        shell: bash
        run: |
          set -euo pipefail
          az deployment sub what-if             --location "$LOCATION"             --name "$DEPLOYMENT_NAME"             --template-file infra/main.bicep             --parameters infra/poc.bicepparam             resourceGroupName="$RESOURCE_GROUP"             namePrefix="$NAME_PREFIX"             --no-pretty-print

      - name: Deploy disposable PoC
        shell: bash
        run: |
          set -euo pipefail

          az deployment sub create             --location "$LOCATION"             --name "$DEPLOYMENT_NAME"             --template-file infra/main.bicep             --parameters infra/poc.bicepparam             resourceGroupName="$RESOURCE_GROUP"             namePrefix="$NAME_PREFIX"             --query properties.outputs             --output json > /tmp/outputs.json

          jq . /tmp/outputs.json

      - name: Verify deployed resources
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(az group exists --name "$RESOURCE_GROUP")" == "true" ]]

          plan_name="$(jq -r '.appServicePlanName.value' /tmp/outputs.json)"
          [[ -n "$plan_name" && "$plan_name" != "null" ]]

          sku="$(az appservice plan show             --resource-group "$RESOURCE_GROUP"             --name "$plan_name"             --query sku.name             --output tsv)"
          [[ "$sku" == "B1" ]]

          app_count="$(jq '.apps.value | length' /tmp/outputs.json)"
          [[ "$app_count" -eq 4 ]]

          for environment in dev uat prod dr; do
            app_name="$(jq -r --arg env "$environment" '.apps.value[] | select(.environment == $env) | .name' /tmp/outputs.json)"
            [[ -n "$app_name" && "$app_name" != "null" ]]

            state="$(az webapp show               --resource-group "$RESOURCE_GROUP"               --name "$app_name"               --query state               --output tsv)"
            [[ "$state" == "Running" ]]

            app_env="$(az webapp config appsettings list               --resource-group "$RESOURCE_GROUP"               --name "$app_name"               --query "[?name=='APP_ENV'].value | [0]"               --output tsv)"
            [[ "$app_env" == "$environment" ]]

            build_during_deploy="$(az webapp config appsettings list               --resource-group "$RESOURCE_GROUP"               --name "$app_name"               --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value | [0]"               --output tsv)"
            [[ "$build_during_deploy" == "false" ]]

            echo "$environment: $app_name (Running, APP_ENV=$app_env)"
          done

          {
            echo "### Azure Bicep PoC"
            echo "- Resource group: `$RESOURCE_GROUP`"
            echo "- App Service Plan: `$plan_name` / B1"
            echo "- Web Apps: 4 (DEV/UAT/PROD/DR)"
            echo "- Slot / PE / self-hosted agent: intentionally not created"
            echo "- Result: deployment verification passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete disposable resource group
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(az group exists --name "$RESOURCE_GROUP")" == "true" ]]; then
            az group delete               --name "$RESOURCE_GROUP"               --yes               --no-wait
          fi

          for attempt in $(seq 1 60); do
            if [[ "$(az group exists --name "$RESOURCE_GROUP")" == "false" ]]; then
              echo "Verified resource group deletion."
              exit 0
            fi
            echo "Waiting for resource group deletion ($attempt/60)..."
            sleep 10
          done

          echo "::error::Resource group still exists after cleanup timeout."
          exit 1

      - name: Remove subscription deployment record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          az deployment sub delete --name "$DEPLOYMENT_NAME" 2>/dev/null || true
