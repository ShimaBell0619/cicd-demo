# One-level step template. Download/verification and swap stay in release.yml.
parameters:
  - name: connection
    type: string
  - name: app
    type: string
  - name: group
    type: string
  - name: url
    type: string
  - name: environment
    type: string
  - name: slot
    type: string
    default: production

steps:
  - task: AzureWebApp@1
    displayName: Deploy ${{ parameters.environment }}
    inputs:
      azureSubscription: ${{ parameters.connection }}
      appType: webAppLinux
      appName: ${{ parameters.app }}
      package: $(Pipeline.Workspace)/release/webapp.zip
      deploymentMethod: zipDeploy
      runtimeStack: 'NODE|22-lts'
      startUpCommand: 'HOSTNAME=0.0.0.0 node server.js'
      ${{ if ne(parameters.slot, 'production') }}:
        deployToSlotOrASE: true
        resourceGroupName: ${{ parameters.group }}
        slotName: ${{ parameters.slot }}
  - bash: python3 pipelines/scripts/smoke.py "$TARGET_URL" "$ARTIFACT_DIR/release.json" "$TARGET_ENV"
    displayName: Verify ${{ parameters.environment }} health and artifact identity
    env:
      TARGET_URL: ${{ parameters.url }}
      TARGET_ENV: ${{ parameters.environment }}
      ARTIFACT_DIR: $(Pipeline.Workspace)/release
