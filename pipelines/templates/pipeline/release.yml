parameters:
  - name: initialProductionRelease
    type: boolean
    default: false

variables:
  nodeVersion: '22.x'
  artifactName: webapp

stages:
  - stage: Build
    displayName: Build immutable release artifact
    jobs:
      - job: Build
        displayName: Build Next.js release
        pool:
          name: release-selfhosted-linux
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - bash: |
              set -euo pipefail

              branch="${BUILD_SOURCEBRANCH#refs/heads/}"
              case "${branch}" in
                release/*|hotfix/*)
                  version="${branch#*/}"
                  ;;
                *)
                  echo "Release pipeline must be run from release/X.Y.Z or hotfix/X.Y.Z." >&2
                  echo "Selected branch: ${branch}" >&2
                  exit 1
                  ;;
              esac

              if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Version must use X.Y.Z format. Selected version: ${version}" >&2
                exit 1
              fi

              echo "##vso[task.setvariable variable=releaseVersion]${version}"
              echo "##vso[build.updatebuildnumber]${version}.${BUILD_BUILDID}"
            displayName: Validate release branch and derive version

          - template: ../steps/node-build.yml
            parameters:
              nodeVersion: $(nodeVersion)
              artifactName: $(artifactName)
              releaseVersion: $(releaseVersion)

  - template: ../stages/deploy-webapp.yml
    parameters:
      stageName: Deploy_DEV
      displayName: Deploy release artifact to DEV
      dependsOn:
        - Build
      environmentName: dev
      azureSubscription: REPLACE_WITH_DEV_SERVICE_CONNECTION
      appName: REPLACE_WITH_DEV_WEB_APP
      artifactName: $(artifactName)
      smokeTestUrl: https://REPLACE_WITH_DEV_HOST

  - template: ../stages/deploy-uat.yml
    parameters:
      stageName: Deploy_UAT
      displayName: Deploy and validate UAT
      dependsOn:
        - Deploy_DEV
      environmentName: uat
      azureSubscription: REPLACE_WITH_UAT_SERVICE_CONNECTION
      appName: REPLACE_WITH_UAT_WEB_APP
      artifactName: $(artifactName)
      smokeTestUrl: https://REPLACE_WITH_UAT_HOST
      approvers: REPLACE_WITH_UAT_APPROVERS

  - stage: Protect_Artifact
    displayName: Protect accepted release artifact
    dependsOn:
      - Deploy_UAT
    condition: succeeded()
    jobs:
      - job: RetainRun
        displayName: Create Azure Pipelines retention lease
        pool:
          name: release-selfhosted-linux
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail

              body="$(cat <<EOF
              [
                {
                  "daysValid": 3650,
                  "definitionId": ${SYSTEM_DEFINITIONID},
                  "ownerId": "release-v${BUILD_BUILDNUMBER}",
                  "protectPipeline": false,
                  "runId": ${BUILD_BUILDID}
                }
              ]
              EOF
              )"

              curl --fail-with-body --silent --show-error                 --request POST                 --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}"                 --header "Content-Type: application/json"                 --data "${body}"                 "${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/build/retention/leases?api-version=7.1"
            displayName: Retain release run and artifacts
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
              SYSTEM_DEFINITIONID: $(System.DefinitionId)
              BUILD_BUILDID: $(Build.BuildId)
              BUILD_BUILDNUMBER: $(Build.BuildNumber)

  - template: ../stages/deploy-prod.yml
    parameters:
      stageName: Deploy_PROD
      displayName: Validate candidate and deploy PROD
      dependsOn:
        - Protect_Artifact
      environmentName: prod
      azureSubscription: REPLACE_WITH_PROD_SERVICE_CONNECTION
      appName: REPLACE_WITH_PROD_WEB_APP
      resourceGroupName: REPLACE_WITH_PROD_RESOURCE_GROUP
      artifactName: $(artifactName)
      slotName: staging
      stagingSmokeTestUrl: https://REPLACE_WITH_PROD_STAGING_HOST
      productionSmokeTestUrl: https://REPLACE_WITH_PROD_HOST
      initialProductionRelease: ${{ parameters.initialProductionRelease }}

  - stage: Tag_Release
    displayName: Tag successful production release
    dependsOn:
      - Deploy_PROD
    condition: succeeded()
    jobs:
      - job: TagRelease
        displayName: Create immutable version tag
        pool:
          name: release-selfhosted-linux
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true

          - bash: |
              set -euo pipefail

              branch="${BUILD_SOURCEBRANCH#refs/heads/}"
              version="${branch#*/}"
              tag="v${version}"
              source_sha="${BUILD_SOURCEVERSION}"

              remote_tag_commit() {
                local refs peeled direct
                refs="$(git ls-remote --tags origin "refs/tags/${tag}*")"
                peeled="$(awk -v wanted="refs/tags/${tag}^{}" '$2 == wanted {print $1; exit}' <<< "${refs}")"
                if [[ -n "${peeled}" ]]; then
                  printf '%s' "${peeled}"
                  return 0
                fi

                direct="$(awk -v wanted="refs/tags/${tag}" '$2 == wanted {print $1; exit}' <<< "${refs}")"
                printf '%s' "${direct}"
              }

              existing="$(remote_tag_commit)"
              if [[ -n "${existing}" ]]; then
                if [[ "${existing}" != "${source_sha}" ]]; then
                  echo "Remote tag ${tag} exists at ${existing}; expected ${source_sha}." >&2
                  exit 1
                fi

                echo "Remote tag ${tag} already points to the expected production SHA."
                exit 0
              fi

              # clean:true does not guarantee removal of local refs from a previous failed push.
              git tag -d "${tag}" >/dev/null 2>&1 || true

              git config user.name "Azure Pipelines"
              git config user.email "azure-pipelines@local.invalid"
              git tag -a "${tag}" "${source_sha}" -m "Production release ${tag}"

              if ! git push origin "refs/tags/${tag}"; then
                echo "Tag push returned an error; verifying remote state before failing." >&2
              fi

              remote_after="$(remote_tag_commit)"
              if [[ "${remote_after}" != "${source_sha}" ]]; then
                echo "Remote tag verification failed. Expected ${source_sha}, got ${remote_after:-<missing>}." >&2
                exit 1
              fi

              echo "Verified remote tag ${tag} -> ${source_sha}."
            displayName: Create and verify remote release tag

  - template: ../stages/deploy-webapp.yml
    parameters:
      stageName: Deploy_DR
      displayName: Deploy same production artifact to DR
      dependsOn:
        - Tag_Release
      environmentName: dr
      azureSubscription: REPLACE_WITH_DR_SERVICE_CONNECTION
      appName: REPLACE_WITH_DR_WEB_APP
      artifactName: $(artifactName)
      smokeTestUrl: https://REPLACE_WITH_DR_HOST
