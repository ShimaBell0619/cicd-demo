parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: prodEnvironmentName
    type: string
  - name: drEnvironmentName
    type: string
  - name: prodAzureSubscription
    type: string
  - name: drAzureSubscription
    type: string
  - name: appName
    type: string
  - name: drAppName
    type: string
  - name: resourceGroupName
    type: string
  - name: artifactName
    type: string
  - name: slotName
    type: string
    default: staging
  - name: stagingSmokeTestUrl
    type: string
  - name: productionSmokeTestUrl
    type: string
  - name: drSmokeTestUrl
    type: string
  - name: tagAzureDevOpsServiceConnection
    type: string
  - name: initialProductionRelease
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - deployment: ReadProductionIdentity
        environment: ${{ parameters.prodEnvironmentName }}
        pool:
          name: deploy-selfhosted-linux
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - bash: |
                    set -euo pipefail
                    response="$(Agent.TempDirectory)/current-production.json"
                    set +e
                    http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30                       --output "${response}" --write-out '%{http_code}' "${PRODUCTION_URL}/api/health")"
                    curl_status=$?
                    set -e

                    current_sha=""
                    current_build=""
                    current_version=""

                    if [[ "${curl_status}" -eq 0 && "${http_code}" == "200" && -s "${response}" ]] &&
                      jq -e '
                        type == "object"
                        and .status == "ok"
                        and .environment == "prod"
                        and (.commitSha | type == "string")
                        and (.buildId | type == "string")
                        and (.version | type == "string")
                      ' "${response}" >/dev/null; then
                      current_sha="$(jq -r '.commitSha' "${response}")"
                      current_build="$(jq -r '.buildId' "${response}")"
                      current_version="$(jq -r '.version' "${response}")"
                    fi

                    echo "Current PROD: ${current_version:-<unknown>} / ${current_sha:-<unknown>} / ${current_build:-<unknown>}"
                    echo "##vso[task.setvariable variable=currentProdSha;isOutput=true]${current_sha}"
                    echo "##vso[task.setvariable variable=currentProdBuild;isOutput=true]${current_build}"
                    echo "##vso[task.setvariable variable=currentProdVersion;isOutput=true]${current_version}"
                  name: ReadIdentity
                  env:
                    PRODUCTION_URL: ${{ parameters.productionSmokeTestUrl }}
                  displayName: Read strict PROD identity

      - job: ReleaseGuard
        dependsOn:
          - ReadProductionIdentity
        pool:
          name: release-control-linux
        workspace:
          clean: all
        variables:
          currentProdSha: $[ dependencies.ReadProductionIdentity.outputs['ReadProductionIdentity.ReadIdentity.currentProdSha'] ]
          currentProdBuild: $[ dependencies.ReadProductionIdentity.outputs['ReadProductionIdentity.ReadIdentity.currentProdBuild'] ]
          currentProdVersion: $[ dependencies.ReadProductionIdentity.outputs['ReadProductionIdentity.ReadIdentity.currentProdVersion'] ]
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true
          - bash: |
              set -euo pipefail

              branch="${BUILD_SOURCEBRANCH#refs/heads/}"
              version="${branch#*/}"
              source_sha="${BUILD_SOURCEVERSION}"
              current_prod_sha="${CURRENT_PROD_SHA}"
              current_prod_version="${CURRENT_PROD_VERSION}"
              tag="v${version}"

              [[ "${branch}" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "Unexpected release source branch: ${branch}" >&2
                exit 1
              }

              git fetch origin main --tags
              main_head="$(git rev-parse origin/main)"
              read -r -a parents <<< "$(git show -s --format='%P' "${main_head}")"

              [[ "${#parents[@]}" -eq 2 ]] || {
                echo "main HEAD must be the candidate Basic merge commit." >&2
                exit 1
              }

              [[ "${parents[1]}" == "${source_sha}" ]] || {
                echo "main HEAD second parent is not the UAT candidate SHA." >&2
                exit 1
              }

              source_tree="$(git rev-parse "${source_sha}^{tree}")"
              main_tree="$(git rev-parse "${main_head}^{tree}")"
              [[ "${source_tree}" == "${main_tree}" ]] || {
                echo "main HEAD tree differs from the UAT candidate tree. Rebuild/retest." >&2
                exit 1
              }

              ! git tag --list "${tag}" | grep -Fxq "${tag}" || {
                echo "Version tag ${tag} already exists." >&2
                exit 1
              }

              [[ -z "${current_prod_version}" || "${current_prod_version}" != "${version}" ]] || {
                echo "PROD already reports version ${version}; use Recovery tag-only if tagging failed." >&2
                exit 1
              }

              if [[ -n "${current_prod_sha}" ]]; then
                git cat-file -e "${current_prod_sha}^{commit}" 2>/dev/null || git fetch origin "${current_prod_sha}" || true
                git cat-file -e "${current_prod_sha}^{commit}" 2>/dev/null || {
                  echo "Current PROD SHA is unavailable in repository history." >&2
                  exit 1
                }
                git merge-base --is-ancestor "${current_prod_sha}" "${source_sha}" || {
                  echo "Candidate would revert currently deployed PROD history." >&2
                  exit 1
                }
              else
                [[ "${INITIAL_RELEASE}" == "true" ]] || {
                  echo "Cannot prove current PROD identity." >&2
                  exit 1
                }
                ! git tag --list 'v[0-9]*' | grep -q . || {
                  echo "Version tags already exist; initial release bypass rejected." >&2
                  exit 1
                }
              fi

              echo "Release guard passed: main=${main_head} candidate=${source_sha}"
            env:
              CURRENT_PROD_SHA: $(currentProdSha)
              CURRENT_PROD_VERSION: $(currentProdVersion)
              INITIAL_RELEASE: ${{ lower(parameters.initialProductionRelease) }}
            displayName: Validate main HEAD and current PROD ancestry

      - deployment: DeployProduction
        dependsOn:
          - ReleaseGuard
        environment: ${{ parameters.prodEnvironmentName }}
        pool:
          name: deploy-selfhosted-linux
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: current
                  artifact: ${{ parameters.artifactName }}
                - template: ../steps/verify-artifact.yml
                  parameters:
                    artifactDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: ${{ parameters.prodAzureSubscription }}
                    appType: webAppLinux
                    appName: ${{ parameters.appName }}
                    deployToSlotOrASE: true
                    resourceGroupName: ${{ parameters.resourceGroupName }}
                    slotName: ${{ parameters.slotName }}
                    package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/webapp.zip
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'HOSTNAME=0.0.0.0 node server.js'
                  displayName: Deploy candidate to PROD staging
                - template: ../steps/smoke-test.yml
                  parameters:
                    url: ${{ parameters.stagingSmokeTestUrl }}
                    expectedEnvironment: prod-staging
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                    displayName: Wait for candidate on PROD staging
                - task: AzureAppServiceManage@0
                  inputs:
                    azureSubscription: ${{ parameters.prodAzureSubscription }}
                    Action: Swap Slots
                    WebAppName: ${{ parameters.appName }}
                    ResourceGroupName: ${{ parameters.resourceGroupName }}
                    SourceSlot: ${{ parameters.slotName }}
                    SwapWithProduction: true
                  displayName: Swap staging to production
                - template: ../steps/smoke-test.yml
                  parameters:
                    url: ${{ parameters.productionSmokeTestUrl }}
                    expectedEnvironment: prod
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                    displayName: Wait for candidate on PROD after swap

      - job: TagProduction
        dependsOn:
          - DeployProduction
        pool:
          name: release-control-linux
        workspace:
          clean: all
        steps:
          - checkout: none
          - download: current
            artifact: ${{ parameters.artifactName }}
          - template: ../steps/verify-artifact.yml
            parameters:
              artifactDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}
              expectedCommitSha: $(Build.SourceVersion)
              expectedBuildId: $(Build.BuildId)
          - bash: |
              set -euo pipefail
              manifest="$(Pipeline.Workspace)/${ARTIFACT_NAME}/release-manifest.json"
              echo "##vso[task.setvariable variable=tagVersion]$(jq -r '.artifactVersion' "${manifest}")"
              echo "##vso[task.setvariable variable=tagCommit]$(jq -r '.commitSha' "${manifest}")"
              echo "##vso[task.setvariable variable=tagBuild]$(jq -r '.pipelineBuildId' "${manifest}")"
              echo "##vso[task.setvariable variable=tagZipSha]$(jq -r '.webAppSha256' "${manifest}")"
            env:
              ARTIFACT_NAME: ${{ parameters.artifactName }}
            displayName: Read immutable tag metadata
          - template: ../steps/create-release-tag.yml
            parameters:
              azureDevOpsServiceConnection: ${{ parameters.tagAzureDevOpsServiceConnection }}
              version: $(tagVersion)
              commitSha: $(tagCommit)
              pipelineBuildId: $(tagBuild)
              webAppSha256: $(tagZipSha)
          - template: ../steps/create-retention-lease.yml
            parameters:
              daysValid: 3650
              ownerPrefix: production

      - deployment: DeployDR
        dependsOn:
          - TagProduction
        environment: ${{ parameters.drEnvironmentName }}
        pool:
          name: deploy-selfhosted-linux
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: current
                  artifact: ${{ parameters.artifactName }}
                - template: ../steps/verify-artifact.yml
                  parameters:
                    artifactDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: ${{ parameters.drAzureSubscription }}
                    appType: webAppLinux
                    appName: ${{ parameters.drAppName }}
                    package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/webapp.zip
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'HOSTNAME=0.0.0.0 node server.js'
                  displayName: Deploy tagged PROD artifact to DR
                - template: ../steps/smoke-test.yml
                  parameters:
                    url: ${{ parameters.drSmokeTestUrl }}
                    expectedEnvironment: dr
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                    displayName: Verify DR matches tagged PROD artifact
