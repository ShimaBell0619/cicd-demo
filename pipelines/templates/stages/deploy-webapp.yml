parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string
  - name: appName
    type: string
  - name: artifactName
    type: string
  - name: smokeTestUrl
    type: string
  - name: expectedEnvironment
    type: string
  - name: freshnessBranchRef
    type: string
    default: ''

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - ${{ if ne(parameters.freshnessBranchRef, '') }}:
          - job: FreshnessGuard
            displayName: Confirm deployment source is still branch HEAD
            pool:
              name: build-ephemeral-linux
            workspace:
              clean: all
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1
                persistCredentials: true
              - bash: |
                  set -euo pipefail
                  remote_head="$(git ls-remote origin "${FRESHNESS_BRANCH_REF}" | awk 'NR==1 {print $1}')"
                  [[ "${remote_head}" == "${BUILD_SOURCEVERSION}" ]] || {
                    echo "A newer branch commit exists. This stale run will not deploy." >&2
                    echo "Run SHA: ${BUILD_SOURCEVERSION}" >&2
                    echo "Branch HEAD: ${remote_head:-<missing>}" >&2
                    exit 1
                  }
                env:
                  FRESHNESS_BRANCH_REF: ${{ parameters.freshnessBranchRef }}
                displayName: Verify remote branch HEAD

      - deployment: Deploy
        ${{ if ne(parameters.freshnessBranchRef, '') }}:
          dependsOn:
            - FreshnessGuard
        environment: ${{ parameters.environmentName }}
        pool:
          name: deploy-selfhosted-linux
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: current
                  artifact: ${{ parameters.artifactName }}
                - template: ../steps/verify-artifact.yml
                  parameters:
                    artifactDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    appType: webAppLinux
                    appName: ${{ parameters.appName }}
                    package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/webapp.zip
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'HOSTNAME=0.0.0.0 node server.js'
                  displayName: Deploy Azure Web App
                - template: ../steps/smoke-test.yml
                  parameters:
                    url: ${{ parameters.smokeTestUrl }}
                    expectedEnvironment: ${{ parameters.expectedEnvironment }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                    displayName: Verify ${{ parameters.environmentName }} artifact identity
