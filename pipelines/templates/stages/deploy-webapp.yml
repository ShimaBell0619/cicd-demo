parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string
  - name: appName
    type: string
  - name: artifactName
    type: string
  - name: smokeTestUrl
    type: string
  - name: expectedEnvironment
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - deployment: Deploy
        environment: ${{ parameters.environmentName }}
        pool:
          name: deploy-selfhosted-linux
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: current
                  artifact: ${{ parameters.artifactName }}
                - template: ../steps/verify-artifact.yml
                  parameters:
                    artifactDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    appType: webAppLinux
                    appName: ${{ parameters.appName }}
                    package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/webapp.zip
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'HOSTNAME=0.0.0.0 node server.js'
                  displayName: Deploy Azure Web App
                - template: ../steps/smoke-test.yml
                  parameters:
                    url: ${{ parameters.smokeTestUrl }}
                    expectedEnvironment: ${{ parameters.expectedEnvironment }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                    displayName: Verify ${{ parameters.environmentName }} artifact identity
