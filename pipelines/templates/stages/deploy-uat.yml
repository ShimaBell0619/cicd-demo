parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string
  - name: appName
    type: string
  - name: artifactName
    type: string
  - name: smokeTestUrl
    type: string
  - name: approvers
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    lockBehavior: sequential

    jobs:
      - deployment: DeployUAT
        displayName: Deploy UAT
        environment: ${{ parameters.environmentName }}
        pool:
          name: deploy-selfhosted-linux
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: current
                  artifact: ${{ parameters.artifactName }}

                - template: ../steps/verify-artifact.yml
                  parameters:
                    artifactName: ${{ parameters.artifactName }}

                - task: AzureWebApp@1
                  displayName: Deploy Azure Web App
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    appType: webAppLinux
                    appName: ${{ parameters.appName }}
                    package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/webapp.zip
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'HOSTNAME=0.0.0.0 node server.js'

                - template: ../steps/smoke-test.yml
                  parameters:
                    url: ${{ parameters.smokeTestUrl }}
                    displayName: Verify UAT artifact identity

      - job: UATAcceptance
        displayName: UAT acceptance and main merge
        dependsOn:
          - DeployUAT
        pool: server
        timeoutInMinutes: 10080
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 8640
            inputs:
              notifyUsers: ${{ parameters.approvers }}
              approvers: ${{ parameters.approvers }}
              allowApproversToApproveTheirOwnRuns: false
              instructions: |
                Confirm UAT for:
                  Version branch: $(Build.SourceBranch)
                  Candidate SHA: $(Build.SourceVersion)
                  Pipeline run: $(Build.BuildId)

                Before resuming:
                1. Confirm UAT passed for this exact candidate.
                2. Complete release/hotfix -> main using Basic merge (no squash/rebase).
                3. Do not add commits to the release/hotfix branch after this build.
                4. Resume this same run only after the PR is merged.
              onTimeout: reject
            displayName: Accept UAT and confirm main merge
