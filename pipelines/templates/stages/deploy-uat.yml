parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string
  - name: appName
    type: string
  - name: artifactName
    type: string
  - name: smokeTestUrl
    type: string
  - name: expectedEnvironment
    type: string
  - name: approvers
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - deployment: DeployUAT
        environment: ${{ parameters.environmentName }}
        pool:
          name: deploy-selfhosted-linux
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: current
                  artifact: ${{ parameters.artifactName }}
                - template: ../steps/verify-artifact.yml
                  parameters:
                    artifactDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    appType: webAppLinux
                    appName: ${{ parameters.appName }}
                    package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/webapp.zip
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'HOSTNAME=0.0.0.0 node server.js'
                  displayName: Deploy UAT
                - template: ../steps/smoke-test.yml
                  parameters:
                    url: ${{ parameters.smokeTestUrl }}
                    expectedEnvironment: ${{ parameters.expectedEnvironment }}
                    expectedCommitSha: $(Build.SourceVersion)
                    expectedBuildId: $(Build.BuildId)
                    displayName: Verify UAT artifact identity

      - job: UATAcceptance
        dependsOn:
          - DeployUAT
        pool: server
        timeoutInMinutes: 10080
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 8640
            inputs:
              notifyUsers: ${{ parameters.approvers }}
              approvers: ${{ parameters.approvers }}
              allowApproversToApproveTheirOwnRuns: false
              instructions: |
                Confirm UAT for:
                  Source branch: $(Build.SourceBranch)
                  Candidate SHA: $(Build.SourceVersion)
                  Release Run ID: $(Build.BuildId)

                Before resuming:
                1. Confirm UAT passed for this exact candidate.
                2. Complete release/hotfix -> main using Basic merge.
                3. Do not squash, rebase, or alter the candidate while merging.
                4. The source branch may be deleted after merge.
                5. Resume this same run only after the PR is merged.
              onTimeout: reject
            displayName: Accept UAT and confirm main merge
