parameters:
  - name: artifactDirectory
    type: string
  - name: expectedCommitSha
    type: string
  - name: expectedBuildId
    type: string
  - name: expectedVersion
    type: string
    default: ''

steps:
  - bash: |
      set -euo pipefail
      cd "${ARTIFACT_DIRECTORY}"

      for file in webapp.zip sbom.cdx.json release-manifest.json artifact-checksums.sha256; do
        [[ -f "${file}" ]] || {
          echo "Required artifact file missing: ${file}" >&2
          exit 1
        }
      done

      expected_names=$'release-manifest.json\nsbom.cdx.json\nwebapp.zip'
      actual_names="$(awk '{print $2}' artifact-checksums.sha256 | sort)"
      [[ "${actual_names}" == "${expected_names}" ]] || {
        echo "Checksum file must contain exactly the expected relative files." >&2
        exit 1
      }

      grep -Eq '(^|[[:space:]])(/|\.\./)' artifact-checksums.sha256 && {
        echo "Absolute or parent-relative checksum paths are forbidden." >&2
        exit 1
      }

      sha256sum --check artifact-checksums.sha256

      manifest_commit="$(jq -er '.commitSha | strings' release-manifest.json)"
      manifest_build="$(jq -er '.pipelineBuildId | strings' release-manifest.json)"
      manifest_version="$(jq -er '.artifactVersion | strings' release-manifest.json)"
      manifest_zip_sha="$(jq -er '.webAppSha256 | strings' release-manifest.json)"
      manifest_sbom_sha="$(jq -er '.sbomSha256 | strings' release-manifest.json)"

      actual_zip_sha="$(sha256sum webapp.zip | awk '{print $1}')"
      actual_sbom_sha="$(sha256sum sbom.cdx.json | awk '{print $1}')"

      [[ "${manifest_commit}" == "${EXPECTED_COMMIT_SHA}" ]] || exit 1
      [[ "${manifest_build}" == "${EXPECTED_BUILD_ID}" ]] || exit 1
      [[ -z "${EXPECTED_VERSION}" || "${manifest_version}" == "${EXPECTED_VERSION}" ]] || exit 1
      [[ "${manifest_zip_sha}" == "${actual_zip_sha}" ]] || exit 1
      [[ "${manifest_sbom_sha}" == "${actual_sbom_sha}" ]] || exit 1

      echo "Artifact verified: ${manifest_version} / ${manifest_commit} / run ${manifest_build}"
    env:
      ARTIFACT_DIRECTORY: ${{ parameters.artifactDirectory }}
      EXPECTED_COMMIT_SHA: ${{ parameters.expectedCommitSha }}
      EXPECTED_BUILD_ID: ${{ parameters.expectedBuildId }}
      EXPECTED_VERSION: ${{ parameters.expectedVersion }}
    displayName: Verify artifact identity and fixed checksum set
