parameters:
  - name: url
    type: string
  - name: displayName
    type: string
    default: Verify deployed release identity

steps:
  - bash: |
      set -euo pipefail

      response="$(Agent.TempDirectory)/health-${SYSTEM_JOBID}-${SYSTEM_JOBATTEMPT}.json"
      http_code="$(curl         --silent         --show-error         --connect-timeout 10         --max-time 30         --retry 6         --retry-all-errors         --retry-delay 5         --output "${response}"         --write-out '%{http_code}'         "${HEALTH_URL}/api/health")"

      cat "${response}"

      if [[ "${http_code}" != "200" ]]; then
        echo "Health endpoint returned HTTP ${http_code}; expected 200." >&2
        exit 1
      fi

      grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "${response}" || {
        echo "Health response status is not ok." >&2
        exit 1
      }

      grep -Eq '"commitSha"[[:space:]]*:[[:space:]]*"'${BUILD_SOURCEVERSION}'"' "${response}" || {
        echo "Health response is not running expected commit ${BUILD_SOURCEVERSION}." >&2
        exit 1
      }

      grep -Eq '"buildId"[[:space:]]*:[[:space:]]*"'${BUILD_BUILDID}'"' "${response}" || {
        echo "Health response is not running expected build ${BUILD_BUILDID}." >&2
        exit 1
      }
    displayName: ${{ parameters.displayName }}
    env:
      HEALTH_URL: ${{ parameters.url }}
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      BUILD_BUILDID: $(Build.BuildId)
