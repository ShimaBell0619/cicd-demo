parameters:
  - name: url
    type: string
  - name: expectedEnvironment
    type: string
  - name: expectedCommitSha
    type: string
  - name: expectedBuildId
    type: string
  - name: expectedVersion
    type: string
    default: ''
  - name: displayName
    type: string
    default: Verify deployed artifact identity
  - name: attempts
    type: number
    default: 30
  - name: delaySeconds
    type: number
    default: 10

steps:
  - bash: |
      set -euo pipefail
      response="$(Agent.TempDirectory)/health-${SYSTEM_JOBID}-${SYSTEM_JOBATTEMPT}.json"

      for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
        rm -f "${response}"
        set +e
        http_code="$(curl           --silent           --show-error           --connect-timeout 10           --max-time 30           --output "${response}"           --write-out '%{http_code}'           "${HEALTH_URL}/api/health")"
        curl_status=$?
        set -e

        if [[ "${curl_status}" -eq 0 && "${http_code}" == "200" && -s "${response}" ]] &&
          jq -e             --arg environment "${EXPECTED_ENVIRONMENT}"             --arg commit "${EXPECTED_COMMIT_SHA}"             --arg build "${EXPECTED_BUILD_ID}"             --arg version "${EXPECTED_VERSION}" '
              type == "object"
              and .status == "ok"
              and (.service | type == "string")
              and .environment == $environment
              and .commitSha == $commit
              and .buildId == $build
              and (($version == "") or (.version == $version))
            ' "${response}" >/dev/null; then
          cat "${response}"
          echo
          exit 0
        fi

        echo "Attempt ${attempt}/${MAX_ATTEMPTS}: expected identity not active yet."
        [[ ! -f "${response}" ]] || cat "${response}" || true
        [[ "${attempt}" -ge "${MAX_ATTEMPTS}" ]] || sleep "${DELAY_SECONDS}"
      done

      echo "Timed out waiting for expected deployed artifact identity." >&2
      exit 1
    env:
      HEALTH_URL: ${{ parameters.url }}
      EXPECTED_ENVIRONMENT: ${{ parameters.expectedEnvironment }}
      EXPECTED_COMMIT_SHA: ${{ parameters.expectedCommitSha }}
      EXPECTED_BUILD_ID: ${{ parameters.expectedBuildId }}
      EXPECTED_VERSION: ${{ parameters.expectedVersion }}
      MAX_ATTEMPTS: ${{ parameters.attempts }}
      DELAY_SECONDS: ${{ parameters.delaySeconds }}
    displayName: ${{ parameters.displayName }}
