parameters:
  - name: nodeVersion
    type: string
  - name: artifactName
    type: string
  - name: releaseVersion
    type: string
    default: ''

steps:
  - task: UseNode@1
    displayName: Use Node.js ${{ parameters.nodeVersion }}
    inputs:
      version: ${{ parameters.nodeVersion }}
      checkLatest: false

  - bash: |
      set -euo pipefail
      if [[ ! -f package-lock.json ]]; then
        echo "package-lock.json is required. Generate and commit it before running CI." >&2
        exit 1
      fi
    displayName: Require committed npm lockfile

  - task: Cache@2
    displayName: Restore npm download cache
    inputs:
      key: 'npm | "$(Agent.OS)" | "${{ parameters.nodeVersion }}" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)" | "${{ parameters.nodeVersion }}"
        npm | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.npm

  - bash: |
      set -euo pipefail
      npm ci         --include=dev         --cache "$(Pipeline.Workspace)/.npm"         --prefer-offline         --no-audit         --no-fund
    displayName: Install locked dependencies

  - task: Cache@2
    displayName: Restore Next.js incremental cache
    inputs:
      key: 'next | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "${{ parameters.nodeVersion }}" | package-lock.json | "$(Build.SourceVersion)"'
      restoreKeys: |
        next | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "${{ parameters.nodeVersion }}" | package-lock.json
        next | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "${{ parameters.nodeVersion }}"
      path: $(Build.SourcesDirectory)/.next/cache

  - bash: |
      set -euo pipefail

      release_version="${RELEASE_VERSION}"
      if [[ -z "${release_version}" ]]; then
        release_version="ci-${BUILD_BUILDID}"
      fi

      cat > app/release-info.generated.js <<EOF
      // Generated by Azure Pipelines. Do not edit in an artifact.
      export const releaseInfo = Object.freeze({
        version: "${release_version}",
        commitSha: "${BUILD_SOURCEVERSION}",
        buildId: "${BUILD_BUILDID}",
      });
      EOF
    displayName: Embed immutable release identity
    env:
      RELEASE_VERSION: ${{ parameters.releaseVersion }}
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      BUILD_BUILDID: $(Build.BuildId)

  - bash: |
      set -euo pipefail
      npm run build
    displayName: Build Next.js

  - bash: |
      set -euo pipefail
      mkdir -p "$(Build.ArtifactStagingDirectory)"

      ./node_modules/.bin/cyclonedx-npm         --omit dev         --output-reproducible         --validate         --output-format JSON         --output-file "$(Build.ArtifactStagingDirectory)/sbom.cdx.json"
    displayName: Generate project dependency CycloneDX SBOM

  - bash: |
      set -euo pipefail

      package_root="$(Build.ArtifactStagingDirectory)/package"
      rm -rf "${package_root}"
      mkdir -p "${package_root}"

      cp -a .next/standalone/. "${package_root}/"

      mkdir -p "${package_root}/.next"
      cp -a .next/static "${package_root}/.next/static"

      if [[ -d public ]]; then
        cp -a public "${package_root}/public"
      fi
    displayName: Prepare standalone deployment directory

  - task: ArchiveFiles@2
    displayName: Create immutable web app zip
    inputs:
      rootFolderOrFile: $(Build.ArtifactStagingDirectory)/package
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(Build.ArtifactStagingDirectory)/webapp.zip
      replaceExistingArchive: true

  - bash: |
      set -euo pipefail

      artifact_dir="$(Build.ArtifactStagingDirectory)"
      rm -rf "${artifact_dir}/package"

      cd "${artifact_dir}"

      zip_sha="$(sha256sum webapp.zip | awk '{print $1}')"
      sbom_sha="$(sha256sum sbom.cdx.json | awk '{print $1}')"

      cat > release-manifest.json <<EOF
      {
        "repository": "$(Build.Repository.Name)",
        "commitSha": "$(Build.SourceVersion)",
        "sourceBranch": "$(Build.SourceBranch)",
        "pipelineDefinitionId": "$(System.DefinitionId)",
        "pipelineBuildId": "$(Build.BuildId)",
        "releaseVersion": "${RELEASE_VERSION}",
        "webAppSha256": "${zip_sha}",
        "sbomSha256": "${sbom_sha}",
        "sbomScope": "project-production-dependencies"
      }
      EOF

      sha256sum webapp.zip sbom.cdx.json release-manifest.json > artifact-checksums.sha256
    displayName: Record release manifest and relative checksums
    env:
      RELEASE_VERSION: ${{ parameters.releaseVersion }}

  - task: PublishPipelineArtifact@1
    displayName: Publish immutable pipeline artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: ${{ parameters.artifactName }}
      publishLocation: pipeline
