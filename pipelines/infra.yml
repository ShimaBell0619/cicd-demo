# The subscription bootstrap (infra/main.bicep) creates the dedicated retained group.
# This pipeline uses Contributor scoped to that group only.
name: infra-$(Date:yyyyMMdd).$(Rev:r)
trigger: none
pr: none

pool:
  name: cicd-selfhosted-linux
  demands:
    - Agent.OS -equals Linux
    - Agent.Name -equals vm-cicd-sh-agent

variables:
  resourceGroup: rg-cicd-selfhosted-jpw
  location: japanwest
  namePrefix: cicd-sh

steps:
  - checkout: self
    clean: true
    persistCredentials: false
  - task: AzureCLI@2
    displayName: Validate, preview and provision retained S1 environment
    inputs:
      azureSubscription: sc-cicd-sh-infra
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        [[ "$BUILD_REASON" == Manual ]] || { echo 'Start infrastructure manually.' >&2; exit 1; }
        az group show -n "$RESOURCE_GROUP" --query tags -o json > /tmp/poc-group-tags.json
        python3 -c 'import json; t=json.load(open("/tmp/poc-group-tags.json")); assert t.get("workload")=="selfhosted-validation" and t.get("lifecycle")=="retained", "Wrong validation group"'
        az bicep build --file infra/app-service.bicep --outfile /tmp/app-service.json
        args=(--resource-group "$RESOURCE_GROUP" --template-file /tmp/app-service.json
          --parameters location="$LOCATION" namePrefix="$NAME_PREFIX" skuName=S1 lifecycle=retained expiresOn='')
        az deployment group validate "${args[@]}" --only-show-errors
        az deployment group what-if "${args[@]}" --only-show-errors
        az deployment group create "${args[@]}" --name "cicd-infra-$BUILD_BUILDID" --only-show-errors
        mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY/infra"
        az deployment group show --resource-group "$RESOURCE_GROUP" --name "cicd-infra-$BUILD_BUILDID" --query properties.outputs -o json > "$BUILD_ARTIFACTSTAGINGDIRECTORY/infra/outputs.json"
    env:
      RESOURCE_GROUP: $(resourceGroup)
      LOCATION: $(location)
      NAME_PREFIX: $(namePrefix)
  - publish: $(Build.ArtifactStagingDirectory)/infra
    artifact: infra
    displayName: Preserve created resource names and URLs
