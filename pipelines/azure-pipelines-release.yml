name: release-$(Date:yyyyMMdd).$(Rev:r)

# A release starts only when a person explicitly queues this pipeline and
# selects a release/X.Y.Z or hotfix/X.Y.Z branch.
trigger: none
pr: none

pool:
  name: self-hosted-linux

variables:
  nodeVersion: '22.x'
  artifactName: webapp

stages:
  - stage: Build
    displayName: Build immutable release artifact
    jobs:
      - job: Build
        displayName: Build Next.js release
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - bash: |
              set -euo pipefail

              branch="${BUILD_SOURCEBRANCH#refs/heads/}"
              case "${branch}" in
                release/*|hotfix/*)
                  version="${branch#*/}"
                  ;;
                *)
                  echo "Release pipeline must be run from release/X.Y.Z or hotfix/X.Y.Z." >&2
                  echo "Selected branch: ${branch}" >&2
                  exit 1
                  ;;
              esac

              if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Version must use X.Y.Z format. Selected version: ${version}" >&2
                exit 1
              fi

              echo "Release version: ${version}"
              echo "##vso[task.setvariable variable=releaseVersion]${version}"
              echo "##vso[build.updatebuildnumber]${version}.${BUILD_BUILDID}"
            displayName: Validate release branch and derive version

          - template: templates/steps/node-build.yml
            parameters:
              nodeVersion: $(nodeVersion)
              artifactName: $(artifactName)
              releaseVersion: $(releaseVersion)

  - template: templates/stages/deploy-webapp.yml
    parameters:
      stageName: Deploy_DEV
      displayName: Deploy release artifact to DEV
      dependsOn:
        - Build
      environmentName: dev
      azureSubscription: REPLACE_WITH_DEV_SERVICE_CONNECTION
      appName: REPLACE_WITH_DEV_WEB_APP
      resourceGroupName: REPLACE_WITH_DEV_RESOURCE_GROUP
      artifactName: $(artifactName)
      smokeTestUrl: ''

  - template: templates/stages/deploy-webapp.yml
    parameters:
      stageName: Deploy_UAT
      displayName: Deploy same artifact to UAT
      dependsOn:
        - Deploy_DEV
      environmentName: uat
      azureSubscription: REPLACE_WITH_UAT_SERVICE_CONNECTION
      appName: REPLACE_WITH_UAT_WEB_APP
      resourceGroupName: REPLACE_WITH_UAT_RESOURCE_GROUP
      artifactName: $(artifactName)
      smokeTestUrl: ''

  - stage: Await_Main_Merge
    displayName: UAT acceptance and main merge
    dependsOn:
      - Deploy_UAT
    condition: succeeded()
    jobs:
      - job: WaitForMainMerge
        displayName: Wait for UAT acceptance and main PR
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 2880
            inputs:
              notifyUsers: ''
              instructions: |
                1. Confirm UAT acceptance for this exact release artifact.
                2. Complete the source branch PR into main using Basic merge (no squash/rebase).
                3. Do not rebuild the application.
                4. Resume this run after the PR is merged.
              onTimeout: reject
            displayName: Confirm UAT and merge source branch to main

  - stage: Finalize_Release
    displayName: Verify main and create release tag
    dependsOn:
      - Await_Main_Merge
    condition: succeeded()
    jobs:
      - job: TagRelease
        displayName: Verify source SHA is in main and tag it
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true

          - bash: |
              set -euo pipefail

              branch="${BUILD_SOURCEBRANCH#refs/heads/}"
              version="${branch#*/}"
              tag="v${version}"
              source_sha="${BUILD_SOURCEVERSION}"

              if [[ ! "${branch}" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Unexpected release source branch: ${branch}" >&2
                exit 1
              fi

              git fetch origin main --tags

              if ! git merge-base --is-ancestor "${source_sha}" origin/main; then
                echo "Source SHA ${source_sha} is not contained in origin/main." >&2
                echo "Merge the release/hotfix PR to main using Basic merge, then retry this stage." >&2
                exit 1
              fi

              if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
                existing_sha="$(git rev-list -n 1 "${tag}")"
                if [[ "${existing_sha}" != "${source_sha}" ]]; then
                  echo "Tag ${tag} already exists at ${existing_sha}, expected ${source_sha}." >&2
                  exit 1
                fi

                echo "Tag ${tag} already points to the expected release SHA."
                exit 0
              fi

              git config user.name "Azure Pipelines"
              git config user.email "azure-pipelines@local.invalid"
              git tag -a "${tag}" "${source_sha}" -m "Release ${tag}"
              git push origin "refs/tags/${tag}"

              echo "Created ${tag} at ${source_sha}."
            displayName: Verify main ancestry and create immutable version tag

  - template: templates/stages/deploy-prod.yml
    parameters:
      stageName: Deploy_PROD
      displayName: Deploy PROD staging and swap
      dependsOn:
        - Finalize_Release
      environmentName: prod
      azureSubscription: REPLACE_WITH_PROD_SERVICE_CONNECTION
      appName: REPLACE_WITH_PROD_WEB_APP
      resourceGroupName: REPLACE_WITH_PROD_RESOURCE_GROUP
      artifactName: $(artifactName)
      slotName: staging
      stagingSmokeTestUrl: https://REPLACE_WITH_PROD_STAGING_HOST
      productionSmokeTestUrl: https://REPLACE_WITH_PROD_HOST

  - template: templates/stages/deploy-webapp.yml
    parameters:
      stageName: Deploy_DR
      displayName: Deploy same artifact to DR
      dependsOn:
        - Deploy_PROD
      environmentName: dr
      azureSubscription: REPLACE_WITH_DR_SERVICE_CONNECTION
      appName: REPLACE_WITH_DR_WEB_APP
      resourceGroupName: REPLACE_WITH_DR_RESOURCE_GROUP
      artifactName: $(artifactName)
      smokeTestUrl: ''
