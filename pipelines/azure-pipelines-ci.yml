name: ci-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - develop
      - release/*
      - hotfix/*

# Azure Repos Git: PR validation is configured by Branch Policy > Build validation.
pr: none

variables:
  nodeVersion: '22.x'
  artifactName: webapp

stages:
  - stage: Build
    displayName: Build and validate
    jobs:
      - job: Build
        displayName: Build Next.js
        pool:
          name: ci-selfhosted-linux
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true

          - template: templates/steps/node-build.yml
            parameters:
              nodeVersion: $(nodeVersion)
              artifactName: $(artifactName)

  - template: templates/stages/deploy-webapp.yml
    parameters:
      stageName: Deploy_DEV
      displayName: Deploy DEV
      dependsOn:
        - Build
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
      environmentName: dev
      azureSubscription: REPLACE_WITH_DEV_SERVICE_CONNECTION
      appName: REPLACE_WITH_DEV_WEB_APP
      artifactName: $(artifactName)
      smokeTestUrl: https://REPLACE_WITH_DEV_HOST
